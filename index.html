<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px;
  }
  h1 { font-size: 2rem; margin-bottom: 8px; }
  p.sub { color: #94a3b8; margin-bottom: 32px; }
  .games { display: flex; flex-direction: column; gap: 16px; width: 100%; max-width: 340px; }
  a.card {
    display: block; text-decoration: none; color: inherit;
    background: #1e293b; border: 1px solid #334155; border-radius: 16px;
    padding: 24px; text-align: center; transition: transform .12s, border-color .12s;
  }
  a.card:hover, a.card:active { transform: scale(1.03); border-color: #38bdf8; }
  .card .icon { font-size: 2.5rem; margin-bottom: 8px; }
  .card .name { font-size: 1.25rem; font-weight: 600; margin-bottom: 4px; }
  .card .desc { font-size: .9rem; color: #94a3b8; }
</style>
</head>
<body>
  <h1>Games</h1>
  <p class="sub">Pick one to play</p>
  <div class="games">
    <a class="card" href="connect-four/">
      <div class="icon">🔴</div>
      <div class="name">Connect Four</div>
      <div class="desc">Drop discs, connect four, play a friend with an invite code</div>
    </a>
    <a class="card" href="tic-tac-toe/">
      <div class="icon">⭕</div>
      <div class="name">Tic-Tac-Toe</div>
      <div class="desc">Play with a friend using an invite code</div>
    </a>
    <a class="card" href="sudoku/">
      <div class="icon">🔢</div>
      <div class="name">Sudoku</div>
      <div class="desc">Classic number puzzle, 5 difficulty levels</div>
    </a>
    <a class="card" href="memory-match/">
      <div class="icon">🃏</div>
      <div class="name">Memory Match</div>
      <div class="desc">Flip cards and match all eight pairs</div>
    </a>
  </div>
</body>
</html>
