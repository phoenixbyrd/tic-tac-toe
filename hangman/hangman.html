<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f3efe5" />
  <link rel="icon" href="data:," />
  <title>Hangman</title>
  <style>
    :root {
      color-scheme: light dark;
      --paper: #f3efe5;
      --paper-deep: #e8e0d0;
      --ink: #20231f;
      --muted: #676b63;
      --rule: #c9c0ae;
      --accent: #bd3a2f;
      --accent-ink: #fff9f0;
      --key: #fffdf8;
      --key-shadow: #bdb3a1;
      --correct: #52754b;
      --correct-soft: #dbe5d6;
      --danger-soft: #edd4cf;
      --focus: #2c6f9d;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #1d211f;
        --paper-deep: #151816;
        --ink: #f2eee4;
        --muted: #b4b6ae;
        --rule: #4a4e48;
        --accent: #ed7163;
        --accent-ink: #1a1614;
        --key: #292e2b;
        --key-shadow: #0e100f;
        --correct: #91b787;
        --correct-soft: #2f4230;
        --danger-soft: #4b2b29;
      }
      meta[name="theme-color"] { color: #1d211f; }
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--paper-deep); }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      background:
        linear-gradient(90deg, transparent 39px, color-mix(in srgb, var(--accent) 17%, transparent) 40px, transparent 41px),
        repeating-linear-gradient(0deg, transparent 0 31px, color-mix(in srgb, var(--rule) 42%, transparent) 32px),
        var(--paper);
      color: var(--ink);
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }
    button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

    .page {
      width: min(1040px, calc(100% - 32px));
      margin: 0 auto;
      padding: clamp(22px, 4vw, 54px) 0 calc(34px + env(safe-area-inset-bottom));
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-left: 40px;
      padding-bottom: 18px;
      border-bottom: 2px solid var(--ink);
    }

    .round-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px 18px;
      color: var(--muted);
      font-size: .84rem;
      font-weight: 750;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .round-meta strong { color: var(--ink); }
    .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }

    .new-game {
      min-height: 44px;
      border: 1.5px solid var(--ink);
      border-radius: 999px;
      padding: 9px 17px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font-weight: 800;
      transition: background .15s ease, color .15s ease, transform .15s ease;
    }
    .new-game:hover { background: var(--ink); color: var(--paper); }
    .new-game:active { transform: translateY(1px); }

    .game-grid {
      display: grid;
      grid-template-columns: minmax(250px, .72fr) minmax(420px, 1.28fr);
      gap: clamp(36px, 7vw, 86px);
      align-items: start;
      margin: clamp(38px, 6vw, 70px) 0 0 40px;
    }

    .figure-column { position: sticky; top: 20px; }
    .figure-wrap {
      width: min(100%, 330px);
      aspect-ratio: 4 / 5;
      display: grid;
      place-items: center;
      margin-inline: auto;
    }
    #gallows { width: 100%; height: 100%; overflow: visible; }
    .wood { stroke: var(--ink); stroke-width: 5; stroke-linecap: round; fill: none; }
    .rope { stroke: var(--accent); stroke-width: 4; stroke-linecap: round; fill: none; }
    .person {
      stroke: var(--accent);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      opacity: 0;
      transform-origin: center;
      transition: opacity .22s ease, transform .22s ease;
      transform: scale(.94);
    }
    .person.visible { opacity: 1; transform: scale(1); }

    .lives {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      min-height: 28px;
      margin-top: 8px;
    }
    .life {
      width: 11px;
      height: 11px;
      border: 2px solid var(--accent);
      border-radius: 50%;
      transition: background .18s ease, opacity .18s ease;
    }
    .life.spent { background: var(--accent); opacity: .32; }
    .lives-label {
      margin-right: 4px;
      font-size: .76rem;
      font-weight: 800;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .1em;
    }

    .play-column { min-width: 0; }
    .category-line {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--accent);
      font-size: .78rem;
      font-weight: 850;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .category-line::before { content: ""; width: 24px; border-top: 2px solid currentColor; }

    h1 {
      margin: 12px 0 9px;
      max-width: 580px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.25rem, 5.2vw, 4.5rem);
      line-height: .98;
      letter-spacing: -.045em;
      font-weight: 700;
    }

    .hint-text {
      margin: 0;
      max-width: 560px;
      color: var(--muted);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1rem, 2vw, 1.18rem);
      line-height: 1.55;
    }

    .word {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 10px;
      margin: clamp(34px, 6vw, 58px) 0 12px;
      min-height: 54px;
      align-items: end;
    }
    .letter-slot {
      width: clamp(26px, 4.7vw, 42px);
      height: 52px;
      display: grid;
      place-items: center;
      border-bottom: 3px solid var(--ink);
      font-family: "Courier New", monospace;
      font-size: clamp(1.55rem, 4vw, 2.35rem);
      font-weight: 800;
      line-height: 1;
    }
    .letter-slot.revealed { animation: reveal .22s ease-out; }
    @keyframes reveal {
      from { transform: translateY(-6px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .status {
      min-height: 28px;
      margin: 10px 0 24px;
      color: var(--muted);
      font-size: .94rem;
      font-weight: 650;
    }
    .status strong { color: var(--ink); }
    .status.win { color: var(--correct); }
    .status.lose { color: var(--accent); }

    .keyboard {
      display: grid;
      grid-template-columns: repeat(10, minmax(34px, 1fr));
      gap: 9px;
      max-width: 640px;
    }
    .key {
      min-width: 0;
      min-height: 46px;
      border: 1.5px solid var(--ink);
      border-radius: 8px;
      background: var(--key);
      color: var(--ink);
      box-shadow: 0 3px 0 var(--key-shadow);
      cursor: pointer;
      font-size: .9rem;
      font-weight: 850;
      text-transform: uppercase;
      transition: transform .1s ease, box-shadow .1s ease, background .15s ease, color .15s ease;
    }
    .key:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
    .key:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--key-shadow); }
    .key:disabled { cursor: default; box-shadow: none; transform: translateY(3px); }
    .key.correct { background: var(--correct-soft); color: var(--correct); border-color: var(--correct); }
    .key.wrong { background: var(--danger-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 65%, var(--rule)); opacity: .72; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 18px;
      margin-top: 24px;
    }
    .hint-button {
      min-height: 44px;
      padding: 10px 15px;
      border: 0;
      border-bottom: 2px solid var(--ink);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font-weight: 800;
    }
    .hint-button:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
    .hint-button:disabled { color: var(--muted); opacity: .55; cursor: default; }
    .action-note { color: var(--muted); font-size: .82rem; }

    .result {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-top: 24px;
      padding: 18px 20px;
      background: var(--ink);
      color: var(--paper);
      border-radius: 4px 18px 4px 4px;
    }
    .result.show { display: flex; animation: resultIn .25s ease-out; }
    @keyframes resultIn { from { opacity: 0; transform: translateY(5px); } }
    .result-copy strong {
      display: block;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.35rem;
      margin-bottom: 3px;
    }
    .result-copy span { color: color-mix(in srgb, var(--paper) 76%, transparent); font-size: .9rem; }
    .again {
      flex: 0 0 auto;
      min-height: 44px;
      border: 0;
      border-radius: 999px;
      padding: 10px 17px;
      background: var(--accent);
      color: var(--accent-ink);
      cursor: pointer;
      font-weight: 850;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 760px) {
      body {
        background:
          linear-gradient(90deg, transparent 19px, color-mix(in srgb, var(--accent) 16%, transparent) 20px, transparent 21px),
          repeating-linear-gradient(0deg, transparent 0 27px, color-mix(in srgb, var(--rule) 36%, transparent) 28px),
          var(--paper);
      }
      .page { width: min(100% - 24px, 560px); padding-top: 18px; min-height: 100svh; display: flex; flex-direction: column; justify-content: space-evenly; }
      .topline { margin-left: 18px; }
      .round-meta .dot, .round-label { display: none; }
      .game-grid {
        grid-template-columns: 1fr;
        gap: 18px;
        margin: 26px 0 0 18px;
      }
      .figure-column {
        position: static;
        display: grid;
        grid-template-columns: minmax(124px, 170px) 1fr;
        align-items: center;
        gap: 18px;
      }
      .figure-wrap { width: 100%; margin: 0; }
      .lives { flex-wrap: wrap; justify-content: flex-start; align-content: center; }
      .lives-label { width: 100%; }
      h1 { margin-top: 8px; }
      .word { margin-top: 30px; gap: 10px 7px; }
      .keyboard { grid-template-columns: repeat(7, 1fr); gap: 9px 7px; }
      .key { min-height: 56px; font-size: 1.02rem; }
    }

    @media (max-width: 390px) {
      .page { width: calc(100% - 18px); }
      .topline, .game-grid { margin-left: 14px; }
      .topline { gap: 10px; }
      .round-meta { font-size: .72rem; gap: 8px; }
      .new-game { padding-inline: 18px; min-height: 52px; font-size: 1rem; }
      .figure-column { grid-template-columns: 112px 1fr; gap: 12px; }
      .letter-slot { width: min(36px, calc((100vw - 76px) / 8)); height: 52px; font-size: 1.8rem; }
      .word { gap: 8px 5px; }
      .keyboard { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 7px 5px; }
      .key { min-height: 52px; border-radius: 6px; font-size: .95rem; }
      .result { align-items: flex-start; flex-direction: column; }
      .again { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
      /* Back button returning to the game hub. */
    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      justify-self: start;
      align-self: flex-start;
      flex: none;
      width: 42px;
      height: 42px;
      margin: 10px 0 0 10px;
      border-radius: 50%;
      border: 1px solid rgba(128, 128, 128, 0.45);
      background: rgba(128, 128, 128, 0.14);
      color: inherit;
      font-size: 24px;
      line-height: 1;
      text-decoration: none;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .back-btn:visited { color: inherit; }
    .back-btn:active { transform: scale(0.93); }
    .topline > .back-btn:first-child,
    .game-head > .back-btn:first-child {
      align-self: center;
      margin: 0;
    }

</style>
</head>
<body>
  <main class="page">
    <div class="topline">
      <a class="back-btn" href="../" aria-label="Back to all games">&#8592;</a>
      <div class="round-meta" aria-label="Game statistics">
        <span><span class="round-label">Round </span><strong id="roundNumber">1</strong></span>
        <span class="dot" aria-hidden="true"></span>
        <span>Wins <strong id="wins">0</strong></span>
        <span class="dot" aria-hidden="true"></span>
        <span>Streak <strong id="streak">0</strong></span>
      </div>
      <button class="new-game" id="newGame" type="button">New word</button>
    </div>

    <section class="game-grid" aria-labelledby="gameHeading">
      <div class="figure-column" aria-label="Six-mistake hangman drawing">
        <div class="figure-wrap">
          <svg id="gallows" viewBox="0 0 320 400" role="img" aria-labelledby="figureTitle figureDesc">
            <title id="figureTitle">Hangman drawing</title>
            <desc id="figureDesc">The drawing appears one part at a time after each incorrect guess.</desc>
            <path class="wood" d="M38 370H280M76 369V30H234V78" />
            <path class="wood" d="M76 86L128 31" />
            <path class="rope" d="M234 30V93" />
            <circle class="person" data-part="0" cx="234" cy="127" r="33" />
            <path class="person" data-part="1" d="M234 160V264" />
            <path class="person" data-part="2" d="M234 184L184 224" />
            <path class="person" data-part="3" d="M234 184L284 224" />
            <path class="person" data-part="4" d="M234 263L194 326" />
            <path class="person" data-part="5" d="M234 263L274 326" />
          </svg>
        </div>
        <div class="lives" id="lives" aria-label="6 guesses remaining">
          <span class="lives-label">Mistakes</span>
          <span class="life"></span><span class="life"></span><span class="life"></span>
          <span class="life"></span><span class="life"></span><span class="life"></span>
        </div>
      </div>

      <div class="play-column">
        <div class="category-line" id="category">Nature</div>
        <h1 id="gameHeading">Solve the hidden word.</h1>
        <p class="hint-text" id="clue">A clue will appear here.</p>

        <div class="word" id="word" aria-label="Hidden word"></div>
        <p class="status" id="status" aria-live="polite">Choose a letter or use your keyboard.</p>

        <div class="keyboard" id="keyboard" aria-label="Letter keyboard"></div>

        <div class="actions" id="actions">
          <button class="hint-button" id="hintButton" type="button">Reveal a letter</button>
          <span class="action-note">Costs one mistake · 2 reveals available</span>
        </div>

        <div class="result" id="result" role="status">
          <div class="result-copy">
            <strong id="resultTitle">You got it.</strong>
            <span id="resultDetail">The word was …</span>
          </div>
          <button class="again" id="again" type="button">Play another</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      var entries = [
        { word: "BADGER", category: "Animals", clue: "A striped-faced woodland digger." },
        { word: "DOLPHIN", category: "Animals", clue: "A clever marine mammal known for whistles and clicks." },
        { word: "PANTHER", category: "Animals", clue: "A shadowy big cat of forests and mountains." },
        { word: "WOMBAT", category: "Animals", clue: "A sturdy Australian burrower with a backward-facing pouch." },
        { word: "PELICAN", category: "Animals", clue: "A coastal bird with an expandable throat pouch." },
        { word: "CHAMELEON", category: "Animals", clue: "A lizard famous for shifting color and swiveling eyes." },
        { word: "CINNAMON", category: "Food", clue: "A fragrant spice rolled from tree bark." },
        { word: "PRETZEL", category: "Food", clue: "A salty baked snack traditionally twisted into a knot." },
        { word: "AVOCADO", category: "Food", clue: "A creamy green fruit with one large pit." },
        { word: "SAFFRON", category: "Food", clue: "A vivid spice gathered from delicate flower threads." },
        { word: "LASAGNA", category: "Food", clue: "A layered pasta dish baked with sauce and cheese." },
        { word: "POPCORN", category: "Food", clue: "A movie-night snack that bursts open when heated." },
        { word: "VOLCANO", category: "Nature", clue: "A mountain that can release lava, ash, and gas." },
        { word: "GLACIER", category: "Nature", clue: "A vast, slow-moving river of ice." },
        { word: "THUNDER", category: "Nature", clue: "The sound wave that follows a flash in a storm." },
        { word: "MEADOW", category: "Nature", clue: "An open field where grasses and wildflowers grow." },
        { word: "TUNDRA", category: "Nature", clue: "A cold, treeless region above the forest line." },
        { word: "MONSOON", category: "Nature", clue: "A seasonal wind pattern often bringing heavy rain." },
        { word: "COMPASS", category: "Objects", clue: "A pocket guide whose needle points north." },
        { word: "LANTERN", category: "Objects", clue: "A portable light protected by a surrounding case." },
        { word: "TELESCOPE", category: "Objects", clue: "An instrument that brings faraway sights closer." },
        { word: "TYPEWRITER", category: "Objects", clue: "A mechanical ancestor of the word processor." },
        { word: "HOURGLASS", category: "Objects", clue: "A timer that lets sand pass through a narrow neck." },
        { word: "UMBRELLA", category: "Objects", clue: "A folding canopy carried when the weather turns wet." },
        { word: "SATURN", category: "Science", clue: "The planet with the solar system's most famous rings." },
        { word: "NEUTRON", category: "Science", clue: "A particle in an atomic nucleus with no electric charge." },
        { word: "GRAVITY", category: "Science", clue: "The force that keeps your feet on the ground." },
        { word: "CRYSTAL", category: "Science", clue: "A solid whose atoms repeat in an orderly pattern." },
        { word: "ECLIPSE", category: "Science", clue: "An event where one celestial body blocks another." },
        { word: "HABITAT", category: "Science", clue: "The natural home of an organism." },
        { word: "JOURNEY", category: "Adventure", clue: "Travel from one place to another, often over some distance." },
        { word: "TREASURE", category: "Adventure", clue: "Something precious that explorers hope to uncover." },
        { word: "CAMPFIRE", category: "Adventure", clue: "A warm gathering point beneath the open sky." },
        { word: "BACKPACK", category: "Adventure", clue: "A hands-free bag carried over both shoulders." },
        { word: "WATERFALL", category: "Adventure", clue: "A river's dramatic drop over a rocky edge." },
        { word: "LABYRINTH", category: "Adventure", clue: "A complicated maze of winding passages." }
      ];

      var alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
      var maxWrong = 6;
      var state = {
        entry: null,
        guessed: [],
        wrong: 0,
        hints: 0,
        ended: false,
        wins: 0,
        streak: 0,
        round: 0,
        lastWord: ""
      };

      var wordEl = document.getElementById("word");
      var keyboardEl = document.getElementById("keyboard");
      var statusEl = document.getElementById("status");
      var categoryEl = document.getElementById("category");
      var clueEl = document.getElementById("clue");
      var resultEl = document.getElementById("result");
      var resultTitleEl = document.getElementById("resultTitle");
      var resultDetailEl = document.getElementById("resultDetail");
      var hintButton = document.getElementById("hintButton");
      var actionNote = document.querySelector(".action-note");
      var livesEl = document.getElementById("lives");

      function pickEntry() {
        var choices = entries.filter(function (item) { return item.word !== state.lastWord; });
        return choices[Math.floor(Math.random() * choices.length)];
      }

      function createKeyboard() {
        keyboardEl.innerHTML = "";
        alphabet.forEach(function (letter) {
          var button = document.createElement("button");
          button.type = "button";
          button.className = "key";
          button.textContent = letter;
          button.setAttribute("aria-label", "Guess " + letter);
          button.dataset.letter = letter;
          button.addEventListener("click", function () { guess(letter); });
          keyboardEl.appendChild(button);
        });
      }

      function startRound() {
        if (state.entry) state.lastWord = state.entry.word;
        state.entry = pickEntry();
        state.guessed = [];
        state.wrong = 0;
        state.hints = 0;
        state.ended = false;
        state.round += 1;

        categoryEl.textContent = state.entry.category;
        clueEl.textContent = state.entry.clue;
        statusEl.className = "status";
        statusEl.textContent = "Choose a letter or use your keyboard.";
        resultEl.classList.remove("show");
        resultEl.setAttribute("aria-hidden", "true");
        document.getElementById("actions").hidden = false;
        hintButton.disabled = false;
        actionNote.textContent = "Costs one mistake · 2 reveals available";
        document.getElementById("roundNumber").textContent = state.round;

        createKeyboard();
        render();
      }

      function render() {
        wordEl.innerHTML = "";
        var spoken = [];
        state.entry.word.split("").forEach(function (letter) {
          var slot = document.createElement("span");
          var shown = state.guessed.indexOf(letter) !== -1 || state.ended && state.wrong >= maxWrong;
          slot.className = "letter-slot" + (shown ? " revealed" : "");
          slot.textContent = shown ? letter : "";
          slot.setAttribute("aria-hidden", "true");
          wordEl.appendChild(slot);
          spoken.push(shown ? letter : "blank");
        });
        wordEl.setAttribute("aria-label", spoken.join(", "));

        document.querySelectorAll(".person").forEach(function (part, index) {
          part.classList.toggle("visible", index < state.wrong);
        });
        document.querySelectorAll(".life").forEach(function (life, index) {
          life.classList.toggle("spent", index < state.wrong);
        });
        var remaining = maxWrong - state.wrong;
        livesEl.setAttribute("aria-label", remaining + (remaining === 1 ? " guess" : " guesses") + " remaining");

        keyboardEl.querySelectorAll(".key").forEach(function (button) {
          var letter = button.dataset.letter;
          var used = state.guessed.indexOf(letter) !== -1;
          button.disabled = used || state.ended;
          button.classList.toggle("correct", used && state.entry.word.indexOf(letter) !== -1);
          button.classList.toggle("wrong", used && state.entry.word.indexOf(letter) === -1);
        });
      }

      function isSolved() {
        return state.entry.word.split("").every(function (letter) {
          return state.guessed.indexOf(letter) !== -1;
        });
      }

      function guess(letter, fromHint) {
        if (state.ended || state.guessed.indexOf(letter) !== -1) return;
        state.guessed.push(letter);
        var correct = state.entry.word.indexOf(letter) !== -1;
        if (!correct || fromHint) state.wrong += 1;

        render();

        if (isSolved()) {
          endRound(true);
        } else if (state.wrong >= maxWrong) {
          endRound(false);
        } else if (fromHint) {
          statusEl.innerHTML = "Revealed <strong>" + letter + "</strong>. That counts as one mistake.";
        } else if (correct) {
          var count = state.entry.word.split(letter).length - 1;
          statusEl.innerHTML = "Yes — <strong>" + letter + "</strong> appears " + count + (count === 1 ? " time." : " times.");
        } else {
          statusEl.innerHTML = "No <strong>" + letter + "</strong>. " + (maxWrong - state.wrong) + " mistakes left.";
        }
      }

      function revealHint() {
        if (state.ended || state.hints >= 2 || state.wrong >= maxWrong - 1) return;
        var available = state.entry.word.split("").filter(function (letter) {
          return state.guessed.indexOf(letter) === -1;
        });
        if (!available.length) return;
        var letter = available[Math.floor(Math.random() * available.length)];
        state.hints += 1;
        guess(letter, true);
        var left = 2 - state.hints;
        hintButton.disabled = left === 0 || state.wrong >= maxWrong - 1 || state.ended;
        actionNote.textContent = left + (left === 1 ? " reveal available" : " reveals available");
      }

      function endRound(won) {
        state.ended = true;
        if (won) {
          state.wins += 1;
          state.streak += 1;
          statusEl.className = "status win";
          statusEl.textContent = "Solved with " + (maxWrong - state.wrong) + " mistakes to spare.";
          resultTitleEl.textContent = "Nicely done.";
          resultDetailEl.textContent = "You uncovered “" + state.entry.word.toLowerCase() + ".”";
        } else {
          state.streak = 0;
          statusEl.className = "status lose";
          statusEl.textContent = "Out of guesses — the answer is revealed above.";
          resultTitleEl.textContent = "The word got away.";
          resultDetailEl.textContent = "It was “" + state.entry.word.toLowerCase() + ".”";
        }
        document.getElementById("wins").textContent = state.wins;
        document.getElementById("streak").textContent = state.streak;
        keyboardEl.querySelectorAll(".key").forEach(function (button) { button.disabled = true; });
        hintButton.disabled = true;
        document.getElementById("actions").hidden = true;
        resultEl.classList.add("show");
        resultEl.removeAttribute("aria-hidden");
        render();
        document.getElementById("again").focus();
      }

      document.getElementById("newGame").addEventListener("click", function () {
        if (!state.ended && state.round > 0) state.streak = 0;
        document.getElementById("streak").textContent = state.streak;
        startRound();
      });
      document.getElementById("again").addEventListener("click", startRound);
      hintButton.addEventListener("click", revealHint);
      document.addEventListener("keydown", function (event) {
        if (event.ctrlKey || event.metaKey || event.altKey) return;
        var letter = event.key.toUpperCase();
        if (/^[A-Z]$/.test(letter)) guess(letter, false);
      });

      startRound();
    }());
  </script>
</body>
</html>
